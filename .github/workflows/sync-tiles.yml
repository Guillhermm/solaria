name: Sync tiles to R2
on:
  workflow_dispatch:
    inputs:
      images:
        description: Image ids separated by spaces, or all
        type: string
        default: all
      apply:
        description: Upload (unchecked lists what would be uploaded)
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: sync-tiles
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install OpenJPEG for the JP2 originals
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libopenjp2-tools
      - name: Cut tiles from the NASA originals
        run: npm run build-tiles -- "$IMAGES"
        env:
          IMAGES: ${{ inputs.images }}
      - name: Sync public/tiles to the bucket
        run: npm run sync-r2 -- ${{ inputs.apply && '--apply' || '' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
