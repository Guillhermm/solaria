name: Sync tiles to R2
on:
  push:
    branches:
      - main
    paths:
      - public/tiles/**
      - data/**
  workflow_dispatch:
    inputs:
      apply:
        description: Upload (unchecked lists what would be uploaded)
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: sync-tiles
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sync public/tiles to the bucket
        run: npm run sync-r2 -- ${{ (github.event_name == 'push' || inputs.apply) && '--apply' || '' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
