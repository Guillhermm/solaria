name: Sync tiles to R2
on:
  workflow_dispatch:
    inputs:
      images:
        description: Image to cut and upload (scripts/build-tiles.test.ts keeps this list in step with data/images)
        type: choice
        default: all
        options:
          - all
          - moon-apollo-11-lroc-nac-2011-11-05
          - moon-apollo-11-lroc-nac-ortho-2011-01-22
          - nili-patera-hirise-2007-06-30
          - nili-patera-hirise-2007-10-13
          - pillars-hubble-1995
          - pillars-hubble-2014
          - pillars-webb-2022-nircam
          - sun-sdo-2024-05-10-aia-1700
          - sun-sdo-2024-05-10-aia-171
          - sun-sdo-2024-05-10-aia-193
          - sun-sdo-2024-05-10-aia-211
          - sun-sdo-2024-05-10-aia-304
          - sun-sdo-2024-05-10-aia-94
          - sun-sdo-2024-05-10-hmi-6173
      apply:
        description: Upload (unchecked lists what would be uploaded)
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: sync-tiles
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install OpenJPEG for the JP2 originals
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libopenjp2-tools
      - name: Cut tiles from the NASA originals
        run: npm run build-tiles -- "$IMAGES"
        env:
          IMAGES: ${{ inputs.images }}
      - name: Sync public/tiles to the bucket
        run: npm run sync-r2 -- ${{ inputs.apply && '--apply' || '' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
